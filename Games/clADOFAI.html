  <style>

      width: 100%;
      height: 100%;
      display: flex;

      align-items: center;

    canvas {
      max-width: 100%;
      max-height: 100%;
      width: auto !important;
      height: auto !important;
      display: block;
    }
  </style>
</head>

<body>
  <div id="gameContainer"></div>

  <script>
    UnityLoader.instantiate(
      "gameContainer",
      "https://cdn.jsdelivr.net/gh/udbsite/adofai@f170efcb1b532312817e69f26ce3f84c99940238/Build/adofaiii4.json"
