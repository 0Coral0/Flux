<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Flux Staff Badge Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800&family=Inter:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root{--bg:#070709;--panel:#14141c;--border:#292936;--text:#f4f4f5;--dim:#94a3b8;--green:#22c55e}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% -20%,rgba(34,197,94,.18),transparent 34%),var(--bg);color:var(--text);font-family:Inter,system-ui}.card{width:min(620px,100%);padding:30px;border:1px solid var(--border);border-radius:16px;background:var(--panel);box-shadow:0 18px 55px #0008}.eyebrow{font:800 .72rem 'JetBrains Mono',monospace;color:var(--green);letter-spacing:.12em}.title{margin:9px 0 7px;font-size:1.65rem}.lede{margin:0 0 25px;color:var(--dim);font-size:.9rem}.example{display:flex;align-items:center;gap:12px;padding:15px 0;border-top:1px solid var(--border)}.avatar{display:grid;place-items:center;width:42px;height:42px;border:2px solid var(--green);border-radius:50%;color:var(--green)}.details{min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.name{font-weight:700}.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border:1px solid;border-radius:999px;font:800 .66rem 'JetBrains Mono',monospace;letter-spacing:.06em}.owner{color:#a7f3d0;border-color:rgba(34,197,94,.55);background:rgba(34,197,94,.13)}.admin{color:#fecaca;border-color:rgba(239,68,68,.56);background:rgba(239,68,68,.12)}.mod{color:#bfdbfe;border-color:rgba(59,130,246,.56);background:rgba(59,130,246,.12)}.note{margin:4px 0 0;font-size:.79rem;color:var(--dim);width:100%}.back{display:inline-flex;margin-top:22px;color:var(--green);font-size:.84rem;text-decoration:none}@media(max-width:440px){.card{padding:22px}.example{align-items:flex-start}}
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">FLUX // STAFF TAGS</div>
    <h1 class="title">Badge preview</h1>
    <p class="lede">These are the tags shown next to staff usernames in Flux chat.</p>
    <section class="example"><div class="avatar"><i class="fa-solid fa-crown"></i></div><div class="details"><span class="name">FluxCreator</span><span class="badge owner"><i class="fa-solid fa-crown"></i> OWNER</span><p class="note">Green crown — permanent owner role.</p></div></section>
    <section class="example"><div class="avatar"><i class="fa-solid fa-shield-halved"></i></div><div class="details"><span class="name">AdminExample</span><span class="badge admin"><i class="fa-solid fa-shield-halved"></i> ADMIN</span><p class="note">Red shield — administrator role.</p></div></section>
    <section class="example"><div class="avatar"><i class="fa-solid fa-wand-magic-sparkles"></i></div><div class="details"><span class="name">ModExample</span><span class="badge mod"><i class="fa-solid fa-wand-magic-sparkles"></i> MOD</span><p class="note">Blue wand — moderator role.</p></div></section>
    <a class="back" href="index.html">← Back to Flux</a>
  </main>
</body>
</html>
