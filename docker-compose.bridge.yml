services:
  flux-bridge:
    build:
      context: .
      dockerfile: discord-bridge/Dockerfile
    env_file:
      - ./discord-bridge/.env
    environment:
      BRIDGE_BIND_HOST: 0.0.0.0
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/flux-firebase-service-account.json
      TRUST_PROXY_CLIENT_IP: "true"
    ports:
      # Caddy is the only public entry point; do not change this to 0.0.0.0.
      - "127.0.0.1:3032:3032"
    volumes:
      - type: bind
        source: ${FLUX_FIREBASE_SERVICE_ACCOUNT_PATH:?Set this in deployment.env}
        target: /run/secrets/flux-firebase-service-account.json
        read_only: true
    restart: unless-stopped
