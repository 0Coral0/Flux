services:
  - type: web
    name: flux-community-bridge
    runtime: node
    rootDir: discord-bridge
    buildCommand: npm ci
    startCommand: node server.mjs
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: BRIDGE_BIND_HOST
        value: 0.0.0.0
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: FIREBASE_PROJECT_ID
        value: aggw-themes
      - key: BRIDGE_FIRESTORE_DATABASE
        value: (default)
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: FLUX_SITE_ORIGIN
        sync: false
      - key: BRIDGE_PUBLIC_URL
        sync: false
      - key: DISCORD_WEBHOOK_URLS
        sync: false
      - key: FLUX_CREATOR_UIDS
        sync: false
